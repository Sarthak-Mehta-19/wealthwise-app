<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insights | WealthWise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap');
        
        body { margin: 0; padding: 0; font-family: 'Noto Sans', sans-serif; background-color: #f8fafc; color: #0f172a; display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR CSS --- */
        .sidebar { height: 100vh; width: 15%; min-width: 250px; background: #FAFAFA; border-right: 1px solid #e5e7eb; position: fixed; display: flex; flex-direction: column; z-index: 50; }
        .sidebar_header { width: 100%; padding: 24px; display: flex; flex-direction: row; border-bottom: 1px solid #e5e7eb; text-decoration: none; color: inherit; transition: opacity 0.2s; box-sizing: border-box; }
        .sidebar_header:hover { opacity: 0.8; }
        .sidebar_header .logo { align-items: center; display: flex; gap: 12px; }
        .sidebar_header .logo .icon { display: flex; height: 40px; width: 40px; font-size: 20px; align-items: center; justify-content: center; background-color: #059669; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2); color: white; }
        .sidebar_header .logo .text { display: flex; flex-direction: column; gap: 2px; }
        .sidebar_header .logo .text .main_text { font-size: 20px; font-weight: 800; line-height: 1.2; color: #0f172a; }
        .sidebar_header .logo .text .subtext { font-size: 11px; font-weight: 600; color: #64748b; }
        .sidebar_main { width: 100%; padding: 20px 16px; display: flex; flex-direction: column; border-bottom: 1px solid #e5e7eb; gap: 32px; flex-grow: 1; overflow-y: auto; box-sizing: border-box; }
        .sidebar_main .title h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: #94a3b8; margin: 0 0 12px 0; padding-left: 8px; }
        .navigation_buttons { display: flex; flex-direction: column; gap: 4px; }
        .nav_btn { display: flex; align-items: center; gap: 12px; text-decoration: none; padding: 10px 12px; border-radius: 10px; transition: all 0.2s ease; }
        .nav_btn .nav_btn_icon { display: flex; align-items: center; justify-content: center; height: 36px; width: 36px; background: #f1f5f9; color: #64748b; border-radius: 10px; transition: all 0.2s ease; }
        .nav_btn .nav_btn_text_box { display: flex; flex-direction: column; gap: 2px; }
        .nav_btn_title h4 { color: #3f3f46; font-size: 14px; font-weight: 600; margin: 0; }
        .nav_btn_subtitle h5 { font-size: 11px; color: #94a3b8; margin: 0; font-weight: 500; }
        .nav_btn:hover { background-color: #f8fafc; transform: translateX(4px); }
        .nav_btn:hover .nav_btn_icon { background-color: #059669; color: white; box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2); }
        .nav_btn.active { background-color: #ecfdf5; }
        .nav_btn.active .nav_btn_icon { background-color: #059669; color: white; }
        .nav_btn.active .nav_btn_title h4 { color: #059669; }
        .sidebar_footer_link { text-decoration: none; color: inherit; display: block; margin-top: auto; }
        .sidebar_footer { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s ease; }
        .sidebar_footer:hover { background-color: #f1f5f9; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-profile_pic { height: 40px; width: 40px; border-radius: 50%; background: #ecfdf5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .user-profile-name h4 { font-size: 14px; font-weight: 700; color: #0f172a; margin: 0; }
        .user-profile-description p { font-size: 11px; color: #64748b; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }

        /* --- MAIN CONTENT CSS --- */
        .main-content { margin-left: 250px; width: calc(100% - 250px); padding: 40px; overflow-y: auto; box-sizing: border-box; }
        .page-header { margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-end; }
        .page-header h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px 0; color: #0f172a; display: flex; align-items: center; gap: 12px; }
        .page-header p { font-size: 15px; color: #64748b; margin: 0; }
        
        .ai-badge { background: linear-gradient(135deg, #8b5cf6, #c084fc); color: white; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; letter-spacing: 0.5px; text-transform: uppercase; }

        .insights-grid { display: grid; grid-template-columns: 1fr 350px; gap: 24px; max-width: 1400px; height: calc(100% - 100px); }

        /* Left Column: Data Insights */
        .insights-col { display: flex; flex-direction: column; gap: 24px; overflow-y: auto; padding-right: 8px; }
        
        .health-card { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; border-radius: 16px; padding: 32px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .health-card::after { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: radial-gradient(circle, rgba(16, 185, 129, 0.4) 0%, transparent 70%); border-radius: 50%; }
        .health-score { font-size: 48px; font-weight: 800; margin: 8px 0; color: #10b981; display: flex; align-items: baseline; gap: 4px; }
        .health-score span { font-size: 16px; font-weight: 600; color: #94a3b8; }

        .insight-card { background: white; border-radius: 16px; padding: 24px; border: 1px solid #e2e8f0; display: flex; gap: 16px; transition: transform 0.2s, box-shadow 0.2s; }
        .insight-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .insight-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .icon-warning { background: #fffbeb; color: #f59e0b; }
        .icon-success { background: #ecfdf5; color: #059669; }
        .icon-info { background: #eff6ff; color: #3b82f6; }
        
        .insight-text h3 { margin: 0 0 8px 0; font-size: 16px; font-weight: 700; color: #0f172a; }
        .insight-text p { margin: 0; font-size: 14px; color: #475569; line-height: 1.5; }

        /* Right Column: AI Chat */
        .chat-col { background: white; border-radius: 16px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); overflow: hidden; }
        .chat-header { padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 12px; background: #f8fafc; }
        .chat-header i { color: #8b5cf6; font-size: 20px; }
        .chat-header h3 { margin: 0; font-size: 16px; font-weight: 700; }
        
        .chat-history { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; background: #ffffff; }
        .chat-msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
        .msg-ai { background: #f1f5f9; color: #0f172a; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-user { background: #059669; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .chat-input-area { padding: 16px; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; gap: 8px; }
        .chat-input { flex-grow: 1; border: 1px solid #cbd5e1; border-radius: 20px; padding: 10px 16px; font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .chat-input:focus { border-color: #8b5cf6; }
        .chat-send { background: #8b5cf6; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
        .chat-send:hover { background: #7c3aed; }
        .chat-send:disabled { background: #cbd5e1; cursor: not-allowed; }

        .typing-indicator { display: none; align-items: center; gap: 4px; padding: 12px 16px; background: #f1f5f9; border-radius: 16px; align-self: flex-start; width: fit-content; border-bottom-left-radius: 4px; }
        .typing-dot { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    </style>
</head>
