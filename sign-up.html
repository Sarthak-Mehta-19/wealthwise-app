<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | WealthWise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap');
        body { margin: 0; padding: 0; font-family: 'Noto Sans', sans-serif; background-color: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .auth-card { background: white; width: 100%; max-width: 400px; border-radius: 16px; padding: 40px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; max-height: 90vh; overflow-y: auto; }
        .logo-icon { background: #0f172a; color: white; height: 48px; width: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 24px; margin: 0 auto 24px auto; }
        .auth-title { font-size: 24px; font-weight: 800; margin: 0 0 8px 0; text-align: center; }
        .auth-subtitle { font-size: 14px; color: #64748b; margin: 0 0 32px 0; text-align: center; }
        .auth-input-group { margin-bottom: 20px; }
        .name-row { display: flex; gap: 12px; margin-bottom: 20px; }
        .name-row .auth-input-group { margin-bottom: 0; flex: 1; }
        .auth-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #334155; }
        .auth-input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box; transition: border-color 0.2s; }
        .auth-input:focus { outline: none; border-color: #0f172a; }
        .auth-submit { width: 100%; padding: 14px; background: #0f172a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        .auth-submit:hover { background: #1e293b; }
        .auth-switch { text-align: center; margin-top: 24px; font-size: 14px; color: #64748b; }
        .auth-switch a { color: #0f172a; font-weight: 600; text-decoration: none; }
        .auth-switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <a href="index.html" style="text-decoration: none;"><div class="logo-icon"><i class="fa-solid fa-wallet"></i></div></a>
        <h2 class="auth-title">Create an Account</h2>
        <p class="auth-subtitle">Start your journey to financial freedom today.</p>

        <form id="sign-up-form">
            <!-- NEW: First and Last Name Fields -->
            <div class="name-row">
                <div class="auth-input-group">
                    <label class="auth-label">First Name</label>
                    <input type="text" id="first-name" class="auth-input" placeholder="Sarthak" required>
                </div>
                <div class="auth-input-group">
                    <label class="auth-label">Last Name</label>
                    <input type="text" id="last-name" class="auth-input" placeholder="Mehta" required>
                </div>
            </div>

            <div class="auth-input-group">
                <label class="auth-label">Email Address</label>
                <input type="email" id="user-name" class="auth-input" placeholder="you@example.com" required>
            </div>
            <div class="auth-input-group">
                <label class="auth-label">Password (Min. 6 chars)</label>
                <input type="password" id="user-password" class="auth-input" placeholder="••••••••" required minlength="6">
            </div>
            
            <p id="error-display" style="color: #ef4444; font-size: 13px; font-weight: 600; display: none; margin: 0 0 16px 0; text-align: center;"></p>
            
            <button type="submit" class="auth-submit" id="submit-btn"><span class="btn-text">Sign Up Free</span><span class="loader" style="display: none;"></span></button>
        </form>

        <div class="auth-switch">
            Already have an account? <a href="login.html">Log in here</a>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const SUPABASE_URL = 'https://khnwfpcuvcyxztgoyhpr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gZOCkHy6H8C03dRVRXJO7w_en4rfq9J';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) window.location.href = 'dashboard.html';
        }
        checkSession();

        document.getElementById('sign-up-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            const email = document.getElementById('user-name').value.trim();
            const password = document.getElementById('user-password').value;
            
            const btnText = document.querySelector('.btn-text');
            const submitBtn = document.getElementById('submit-btn');
            const errorDisplay = document.getElementById('error-display');

            submitBtn.disabled = true;
            btnText.innerText = "Creating Account...";
            errorDisplay.style.display = 'none';

            // Send Email, Password, AND Name metadata to Supabase
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        first_name: firstName,
                        last_name: lastName
                    }
                }
            });

            if (error) {
                errorDisplay.innerText = error.message;
                errorDisplay.style.display = 'block';
                submitBtn.disabled = false;
                btnText.innerText = "Sign Up Free";
            } else {
                errorDisplay.innerText = "Account created securely! Redirecting...";
                errorDisplay.style.color = "#10b981";
                errorDisplay.style.display = 'block';
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
            }
        });
    </script>

    
</body>
</html>
